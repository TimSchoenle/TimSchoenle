# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
tone_instructions: "Direct, no filler, no praise."

reviews:
  profile: assertive

  auto_review:
    # CodeRabbit cannot filter by head branch, so Renovate pull requests are skipped by author.
    # Both the bot login and the bare app slug are listed because the match is exact. The daily
    # profile update commits straight to main and opens no pull request.
    ignore_usernames:
      - "renovate[bot]"
      - "renovate"

  # Generated by the scripts and committed by the daily update workflow. Review the scripts and
  # the template instead.
  path_filters:
    - "!bun.lock"
    - "!README.md" # rendered from templates/README.md.template
    - "!assets/**" # SVGs drawn by contact-buttons.ts, tech-stack.ts and stats-card.ts
    - "!scripts/types.ts" # generated by scripts/generate-types.ts

  path_instructions:
    - path: "scripts/**/*.ts"
      instructions: |
        Generators for the profile README and its SVGs, run unattended daily with a write token.
        Flag:
        - Data from tim-schoenle.de or WakaTime written into Markdown, HTML or SVG without escaping
          (XML entities, attribute quoting) or URLs used without scheme validation (only https/mailto).
        - Network calls without timeout, status check, or schema validation of the response; a failed
          optional source (WakaTime) must keep the previous output, a failed required source must fail
          the run rather than write a broken page.
        - `WAKATIME_API_KEY` or other secrets reaching logs, URLs, or committed output.
        - Non-deterministic output (unsorted collections, timestamps, locale-dependent formatting) that
          produces a commit on every run without a content change.
        - Missing or inaccurate TSDoc; the lint gate requires it on every declaration.
        Behaviour changes need coverage in `scripts/readme.test.ts`.
    - path: "templates/README.md.template"
      instructions: |
        Source of the public profile page. Check heading hierarchy, wording, and that every
        `{{PLACEHOLDER}}` is produced by `scripts/render.ts` and vice versa.
    - path: "THIRD_PARTY_NOTICES.md"
      instructions: |
        Every logo in `scripts/logos.ts` that does not come from Simple Icons (CC0) needs its licence
        and attribution here; flag additions without a matching entry.
    - path: ".github/workflows/**"
      instructions: |
        Every third-party action must be pinned to a full commit SHA with a version comment.
        Require least-privilege `permissions:` at workflow or job level, `persist-credentials: false`
        on checkout unless pushing, no untrusted `${{ github.event.* }}` interpolation into `run:`,
        and no `pull_request_target` that checks out or executes PR code. The update workflow holds a
        contents-write app token; keep its scope and its exposure to third-party steps minimal.

  pre_merge_checks:
    title:
      mode: error
      requirements: |
        Must follow Conventional Commits: `type(scope)?!?: subject`. Allowed types: feat, fix, perf,
        revert, docs, refactor, test, style, ci, build, chore, deps. Lowercase, imperative subject,
        no trailing period.

  tools:
    # Already enforced in CI (`bun run lint`); duplicating it adds noise.
    eslint:
      enabled: false
    # Not used here; their rule sets would conflict with the ESLint configuration.
    biome:
      enabled: false
    oxc:
      enabled: false
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
