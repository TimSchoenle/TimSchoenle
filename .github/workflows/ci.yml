name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to checkout code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Installs the Bun `packageManager` in package.json names and runs `bun install
      # --frozen-lockfile`. The node_modules cache is written only on pushes to main; pull requests
      # read it and never save.
      - name: Setup Bun
        uses: TimSchoenle/actions/actions/bun/setup-cached@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-bun-setup-cached-v2.0.0

      # The doc comment gate. eslint.config.mjs holds it and --max-warnings 0, set in the lint
      # script, is what makes jsdoc/require-jsdoc fail the run rather than print.
      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
