name: CodeRabbit Review

# workflow_run, not pull_request_target: GitHub runs this file from the default branch, so a pull
# request cannot rewrite the job that receives the token, and nothing from the pull request is
# checked out or run. It follows `CI`, which run on every pull request, so CodeRabbit reviews the
# head after CI has passed. The action reads the pull request from the event and skips it when its
# head has moved since, when it is a draft or a bot's, and when it targets another branch than the
# default.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- no checkout, no code from the pull request; see above
    workflows: [CI]
    types: [completed]

# A newer push to the same branch supersedes a run that has not posted yet. The head repository is
# part of the group, so a fork branch with the same name cannot cancel a run of this repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  trigger-review:
    name: Trigger CodeRabbit Review
    # CodeRabbit does not review public repositories under 10 stars on its own, and answers
    # `@coderabbitai review` only from a user account, so the comment is posted with a personal
    # access token. Only a successful run on a branch of this repository asks. A fork's run stops
    # here, before the job enters the environment that holds the token.
    # Renovate and release-please branches stop here too: their pull requests are a bot's, which
    # the action skips, so entering the environment for them only spends a runner.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'renovate/') &&
      !startsWith(github.event.workflow_run.head_branch, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CODERABBIT_TRIGGER_TOKEN is an environment secret. The `coderabbit` environment must be
    # restricted to the default branch in the repository settings, so no workflow a pull request
    # adds can read it. `deployment: false` keeps each run from recording a deployment.
    environment:
      name: coderabbit
      deployment: false
    permissions: {} # the comment is posted with the token, not github.token
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Trigger CodeRabbit Review
        uses: TimSchoenle/actions/actions/maintenance/trigger-coderabbit-review@6a49261c7bbd756b4ceca9b1c168dfc7dc095e64 # tag=actions-maintenance-trigger-coderabbit-review-v2.0.0
        with:
          token: ${{ secrets.CODERABBIT_TRIGGER_TOKEN }}
