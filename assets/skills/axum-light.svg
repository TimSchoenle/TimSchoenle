<svg xmlns="http://www.w3.org/2000/svg" width="104" height="88" viewBox="0 0 104 88" role="img" aria-labelledby="title">
<title id="title">Axum</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
.tile { animation: tile-in 420ms ease-out 40ms backwards; }
@keyframes tile-in { from { opacity: 0; translate: 0 6px; } to { opacity: 1; translate: 0 0; } }
@media (prefers-reduced-motion: reduce) { .tile { animation: none; } }
</style>
<g class="tile">
<rect x="0.5" y="0.5" width="95" height="79" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<g transform="translate(32 13.0)"><circle cx="16" cy="16" r="15" fill="none" stroke="#0969da" stroke-width="2"/><text x="16" y="16" dy="0.35em" text-anchor="middle" font-size="13.44" font-weight="700" fill="#0969da">Ax</text></g>
<text x="48" y="66" text-anchor="middle" font-size="12.0" font-weight="600" fill="#1f2328">Axum</text>
</g>
</svg>
